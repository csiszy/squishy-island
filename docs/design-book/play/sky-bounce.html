<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sky Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Nunito:wght@600;800;900&amp;display=swap">
<style>
/* Sky Bounce — playable prototype of a Squishy Island minigame. One file, works on phone and PC. */
:root{--ink:#3A2A4A;--accent:#4A9BFF;--bg1:#D9CCFF;--bg2:#DFF3FF;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{position:absolute;display:block;touch-action:none;border-radius:calc(var(--s,1) * 0px);box-shadow:0 10px 40px rgba(43,33,65,.25)}
.ui{position:absolute;pointer-events:none;display:grid;place-items:center}
.card{pointer-events:auto;width:86%;max-height:92%;overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:20px 20px 18px;text-align:center;font-size:calc(var(--s) * 15px)}
.card h1{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-size:2.4em;line-height:1;margin:.15em 0 .1em;color:var(--accent);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.eyebrow{margin:0;font-weight:900;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#6E6688}
.sub{margin:.2em 0 .8em;font-weight:800;color:#6E6688}
.card ul{text-align:left;margin:0 0 .8em;padding-left:1.2em;display:grid;gap:.35em;font-weight:700;line-height:1.35}
.best{margin:.2em 0 .6em;font-weight:800}
.nb{margin:.2em 0 .6em;font-weight:900;color:#E5484D;font-size:1.15em}
.go{font:inherit;font-family:"Bagel Fat One",system-ui,sans-serif;font-size:1.6em;color:#fff;background:var(--accent);border:3px solid var(--ink);border-radius:999px;padding:.35em 1.6em;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.go:focus-visible{outline:3px solid #FFD54A;outline-offset:3px}
.keys{margin:.8em 0 0;font-size:.8em;font-weight:800;color:#8C84A3}
/* coins */
.ci{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0 0 22%,#FFD54A 24%);border:2px solid #C98A12;vertical-align:-.15em;margin-right:.3em}
.rw{margin:.2em 0 .7em;font-weight:900;font-size:.92em}.rw span{font-weight:800;color:#6E6688;font-size:.92em}
.pay{background:#FFF7D6;border:2.5px solid var(--ink);border-radius:16px;padding:.5em .6em;margin:.3em 0 .5em}
.pay-big{margin:0;font-family:"Bagel Fat One",system-ui,sans-serif;font-size:1.5em;color:#C98A12;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.pay-sm{margin:.15em 0 0;font-weight:800;font-size:.85em;color:#6E6688}.pay-sm b{color:var(--ink)}
.wallet{margin:.1em 0 .7em;font-weight:800;font-size:.75em;color:#8C84A3}.wallet b{color:var(--ink)}
/* level games */
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars i{width:.9em;height:.9em;background:#E3DEEF;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.stars i.on{background:#FFC93C}
.stars.big{font-size:2.2em;gap:6px;margin:.1em 0}.stars.big i{filter:drop-shadow(0 2px 0 var(--ink))}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em;margin:.9em 0 0}
.lv{font:inherit;font-weight:900;font-size:1.05em;display:grid;justify-items:center;gap:.1em;padding:.35em 0 .3em;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.lv .stars{font-size:.62em}.lv.cur{background:#FFF3B0}.lv.boss{background:#FFE3EF}.lv.lock{opacity:.4;cursor:default;box-shadow:none;border-style:dashed}
.lv:focus-visible,.ghost:focus-visible{outline:3px solid #FFD54A;outline-offset:2px}
.how{margin:0 0 .4em;text-align:left}.how summary{cursor:pointer;font-weight:900;color:var(--accent);text-align:center;margin-bottom:.4em}
.trks{display:grid;gap:.4em;margin:.8em 0 0;max-height:40vh;overflow:auto;padding:2px}
.trk{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:.05em .5em;align-items:center;padding:.45em .7em;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.trk .tn{font-weight:900}.trk .tm{grid-column:1;font-size:.78em;font-weight:800;color:#6E6688}.trk .stars{grid-row:1/span 2;grid-column:2;font-size:.8em}
.trk.cur{background:#FFF3B0}.trk.lock{opacity:.5;cursor:default;box-shadow:none;border-style:dashed}.trk:focus-visible{outline:3px solid #FFD54A;outline-offset:2px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em;margin:.6em 0;max-height:52vh;overflow:auto;padding:2px}
.sh{font:inherit;display:grid;justify-items:center;gap:0;padding:.3em .2em;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.sh img{width:3.4em;height:3.4em}.sh b{font-size:.85em}.sh span{font-size:.66em;font-weight:800;color:#6E6688}.sh:focus-visible{outline:3px solid #FFD54A;outline-offset:2px}
.own{display:flex;align-items:center;justify-content:center;gap:.5em;margin:.2em 0 .3em;font-weight:900}.ghost.sm{padding:.1em .8em;font-size:1.1em}
.lv small{font-size:.62em;font-weight:900;color:#6E6688}
.adbar{height:.7em;border-radius:1em;background:#F2EFFA;border:2px solid var(--ink);overflow:hidden;margin:.6em 0 .2em}.adbar i{display:block;height:100%;background:var(--accent);transition:width .9s linear}
.btnrow{display:flex;justify-content:center;gap:.6em;margin-top:.5em;flex-wrap:wrap}
.ghost{font:inherit;font-weight:900;font-size:.95em;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:.35em 1.1em;cursor:pointer}
/* results counters */
[data-count]{display:inline-block;font-variant-numeric:tabular-nums}
[data-count].pop{animation:cpop .28s ease-out}
@keyframes cpop{40%{transform:scale(1.22)}}
.nb.later{visibility:hidden}
.tourback{background:#FFF8E8;border:2.5px dashed var(--ink);border-radius:16px;padding:.5em .7em;margin-top:.7em;font-weight:800}
.tourback p{margin:0 0 .5em}
.tourback .go{display:inline-block;text-decoration:none;font-size:1.25em}
.nb.stamp{animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.go:active{transform:none}[data-count].pop,.nb.stamp{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   SQUISHVILLE SOUND + SETTINGS  ·  art/sound.js
   One small file shared by the design pages and every playable prototype.
   - SQS.settings      the player's settings (saved in this browser)
   - SQS.set({...})    change settings (the Settings page uses this)
   - SQS.play(name)    play a sound effect (list: SQS.SFX_LIST)
   - SQS.music(name)   start a background music track (list: SQS.TRACKS), SQS.music(null) stops
   - SQS.buzz(ms)      vibrate (only if vibration is on)
   - SQS.tier()        graphics tier actually in use: 'low' | 'medium' | 'high'
   Every sound is made live with the Web Audio API (no sound files), so the
   prototypes stay single files. The real game should use recorded/produced
   versions of the same sounds (see sound.html).
   ===================================================================== */
(function () {
'use strict';
if (window.SQS) return;
const SQS = window.SQS = {};
const KEY = 'sqv-settings';
const DEF = {
  sfx: true, sfxVol: .8, music: true, musicVol: .5, vibration: true,
  quality: 'auto', fps: 60, motion: 'full', battery: false,
  gemConfirm: true, hints: true, lefty: false, textSize: 'normal', colour: false, lang: 'en',
  notif: false, playLimit: 0, trading: true, purchases: 'gate', adsOff: false
};
SQS.DEFAULTS = DEF;
const load = () => { let v = {}; try { v = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {} return Object.assign({}, DEF, v); };
let S = SQS.settings = load();
const subs = [];
SQS.onChange = f => subs.push(f);
SQS.set = patch => { Object.assign(S, patch); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} apply(); subs.forEach(f => { try { f(S); } catch (e) {} }); };
SQS.reset = () => { try { localStorage.removeItem(KEY); } catch (e) {} Object.keys(S).forEach(k => delete S[k]); Object.assign(S, DEF); apply(); subs.forEach(f => f(S)); };
window.addEventListener('storage', e => { if (e.key === KEY) { const n = load(); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, n); apply(); subs.forEach(f => f(S)); } });

/* ---------------- graphics tier ----------------
   'auto' picks a tier from the device the first time (cores, memory, screen),
   then remembers it. Battery saver always means 'low' at 30 fps. */
SQS.detect = () => {
  const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4, dpr = window.devicePixelRatio || 1;
  const px = (screen.width || 400) * (screen.height || 800) * dpr * dpr;
  let pts = 0; pts += cores >= 8 ? 2 : cores >= 6 ? 1 : 0; pts += mem >= 6 ? 2 : mem >= 4 ? 1 : 0; if (px > 6e6 && cores < 6) pts--;
  const tier = pts >= 3 ? 'high' : pts >= 1 ? 'medium' : 'low';
  return { tier, cores, mem: navigator.deviceMemory ? mem + ' GB' : 'unknown', dpr };
};
SQS.tier = () => {
  if (S.battery) return 'low';
  if (S.quality !== 'auto') return S.quality;
  let t = null; try { t = localStorage.getItem('sqv-detected'); } catch (e) {}
  if (!t) { t = SQS.detect().tier; try { localStorage.setItem('sqv-detected', t); } catch (e) {} }
  return t;
};
SQS.fps = () => S.battery ? 30 : S.fps;
SQS.reduced = () => S.motion === 'reduced' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && S.motion !== 'full-forced');
SQS.buzz = ms => { if (!S.vibration) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------------- audio graph ---------------- */
let ac = null, master = null, sfxBus = null, musBus = null, nbuf = null, verb = null;
const foreign = [];   // games with their own AudioContext route through these
const vol = bus => bus === 'music' ? (S.music ? S.musicVol : 0) : (S.sfx ? S.sfxVol : 0);
SQS.vol = vol;
function graph(c) {
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
  const m = c.createGain(); m.gain.value = .9; m.connect(comp); comp.connect(c.destination);
  const sb = c.createGain(), mb = c.createGain(); sb.connect(m); mb.connect(m);
  const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // a small soft room so bells and plucks sound round
  const v = c.createConvolver(), L = Math.floor(c.sampleRate * 1.2), ir = c.createBuffer(2, L, c.sampleRate);
  for (let k = 0; k < 2; k++) { const x = ir.getChannelData(k); for (let i = 0; i < L; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 3); }
  v.buffer = ir; const vg = c.createGain(); vg.gain.value = .18; v.connect(vg); vg.connect(m);
  return { ac: c, master: m, sfxBus: sb, musBus: mb, nbuf: nb, verb: v };
}
function ctx() {
  if (!ac) {
    try { ({ ac, master, sfxBus, musBus, nbuf, verb } = graph(new (window.AudioContext || window.webkitAudioContext)())); apply(); }
    catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended' && !(window.OfflineAudioContext && ac instanceof OfflineAudioContext)) { try { ac.resume(); } catch (e) {} }
  return ac;
}
/* render a sound effect or one full loop of a song to an AudioBuffer (for exporting to the real game) */
function offline(seconds, fn, sr = 44100) {
  const saved = { ac, master, sfxBus, musBus, nbuf, verb };
  const g = graph(new OfflineAudioContext(2, Math.ceil(seconds * sr), sr));
  ({ ac, master, sfxBus, musBus, nbuf, verb } = g); sfxBus.gain.value = .8; musBus.gain.value = .55;
  try { fn(ac); } finally { const p = ac.startRendering(); ({ ac, master, sfxBus, musBus, nbuf, verb } = saved); return p; }
}
SQS.renderFX = (name, seconds = 2.4) => offline(seconds, c => FX[name][1](c.currentTime + .01, .5));
SQS.renderTrack = id => { const T = TRACKS[id], spb = 60 / T.bpm / 2, steps = 16 * 8, len = steps * spb;
  return offline(len + 2.5, () => { const st = startTrack(id, true); for (let i = 0; i < steps; i++) st.play(i, .05 + i * spb); }).then(buf => ({ buf, loopEnd: .05 + len })); };
SQS.wav = buf => { // 16-bit PCM WAV
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) out.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, k) => buf.getChannelData(k)); let o = 44;
  for (let i = 0; i < n; i++) for (let k = 0; k < ch; k++) { const v = Math.max(-1, Math.min(1, data[k][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7FFF, true); o += 2; }
  return new Blob([out], { type: 'audio/wav' });
};
SQS.ctx = ctx;
function apply() {
  if (ac) { sfxBus.gain.setTargetAtTime(vol('sfx'), ac.currentTime, .03); musBus.gain.setTargetAtTime(vol('music') * .55 * duck, ac.currentTime, .15); }
  foreign.forEach(f => { f.sfx.gain.value = vol('sfx'); f.music.gain.value = vol('music'); });
}
/* for games that make their own AudioContext: SQS.out(theirContext, 'sfx' | 'music') */
SQS.out = (c, bus = 'sfx') => {
  if (c === ac) return bus === 'music' ? musBus : sfxBus;
  let f = foreign.find(x => x.c === c);
  if (!f) { f = { c, sfx: c.createGain(), music: c.createGain() }; f.sfx.connect(c.destination); f.music.connect(c.destination); foreign.push(f); apply(); }
  return f[bus];
};
// browsers only allow sound after the first tap or key press
const unlock = () => { ctx(); if (wantTrack && !cur && S.music) startTrack(wantTrack); };
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

/* ---------------- building blocks ---------------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(f, d, o = {}) {
  if (!ac) return; const t = (o.t || ac.currentTime), type = o.type || 'sine', v = o.v ?? .15, out = o.bus === 'music' ? (o.out || musBus) : sfxBus;
  const osc = ac.createOscillator(), g = ac.createGain(); osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f * o.slide), t + d * (o.slideT || 1));
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = f * .012; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + .1); }
  const a = o.a ?? .005; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a);
  if (o.hold) g.gain.setValueAtTime(v, t + o.hold);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  let node = g; if (o.lp) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lp; g.connect(lp); node = lp; }
  osc.connect(g); node.connect(out); if (o.wet) { const wg = ac.createGain(); wg.gain.value = o.wet; node.connect(wg); wg.connect(verb); }
  osc.start(t); osc.stop(t + d + .05);
}
function noise(d, o = {}) {
  if (!ac) return; const t = o.t || ac.currentTime, out = o.bus === 'music' ? (o.out || musBus) : sfxBus;
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); n.buffer = nbuf;
  f.type = o.ft || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f || 2000, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + d);
  const v = o.v ?? .12; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.a ?? .004)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random() * .5, d + .05);
}
const bell = (m, t, v = .1, d = .9) => { tone(mtof(m), d, { t, v, wet: .6 }); tone(mtof(m) * 2.76, d * .45, { t, v: v * .35, wet: .6 }); };
const pluck = (m, t, v = .12, d = .35, out) => { tone(mtof(m), d, { t, v, type: 'triangle', bus: out ? 'music' : 'sfx', out, wet: .3 }); tone(mtof(m) * 2, d * .5, { t, v: v * .25, bus: out ? 'music' : 'sfx', out }); };
const arp = (ms, gap, f, t0) => ms.forEach((m, i) => f(m, t0 + i * gap));

/* ---------------- the sound effects ----------------
   name: [description for sound.html, function(t)] */
const FX = {
  tap: ['Any button or bubble tapped: a soft "pop"', t => { tone(880, .07, { t, v: .12, slide: 1.5 }); noise(.02, { t, f: 3000, v: .03 }); }],
  back: ['Close / back: the pop in reverse', t => tone(900, .09, { t, v: .1, slide: .6 })],
  open: ['A panel or card slides open: a bubbly "bloop"', t => tone(330, .12, { t, v: .14, slide: 2.2, slideT: .8 })],
  toggleOn: ['A setting switched on: two notes up', t => { bell(84, t, .07, .25); bell(91, t + .07, .07, .3); }],
  toggleOff: ['A setting switched off: two notes down', t => { bell(91, t, .06, .25); bell(84, t + .07, .06, .3); }],
  coin: ['One coin picked up', t => { tone(1319, .08, { t, v: .09, type: 'square', lp: 4000 }); tone(1976, .22, { t: t + .07, v: .09, type: 'square', lp: 4000 }); }],
  tick: ['Results counter ticking up (pitch rises as it counts)', (t, p = 0) => tone(900 + p * 900, .035, { t, v: .07, type: 'triangle' })],
  countDone: ['Counter reached its number: bright "ding"', t => { bell(88, t, .1, 1.1); bell(95, t + .02, .07, 1.1); }],
  coinsCount: ['Coins counter: tiny coin clinks while counting', (t, p = 0) => tone(1600 + p * 600, .05, { t, v: .05, type: 'square', lp: 5000 })],
  jar: ['Coins drop into the coin jar', t => { [0, .05, .09, .14, .2].forEach((d, i) => tone(1800 + i * 180, .06, { t: t + d, v: .05, type: 'square', lp: 5000 })); }],
  newBest: ['New best score stamp: a happy fanfare', t => { arp([72, 76, 79, 84], .08, (m, tt) => pluck(m, tt, .12, .5), t); bell(88, t + .34, .1, 1.4); }],
  buy: ['Something bought with coins: "ka-ching!"', t => { noise(.06, { t, f: 2500, q: .8, v: .1 }); tone(2093, .5, { t: t + .05, v: .08, type: 'square', lp: 6000 }); tone(2637, .6, { t: t + .1, v: .07, type: 'square', lp: 6000 }); }],
  gemBuy: ['Something bought with Gems: a sparkly rising chime', t => { arp([79, 83, 86, 91, 95], .06, (m, tt) => bell(m, tt, .08, .9), t); noise(.6, { t: t + .1, ft: 'highpass', f: 7000, v: .03, a: .2 }); }],
  gemAsk: ['"Are you sure?" pop-up for Gems', t => { bell(81, t, .08, .5); bell(78, t + .12, .08, .6); }],
  nope: ['Can’t do that (not enough coins, locked): a soft "uh-uh"', t => { tone(300, .12, { t, v: .1, type: 'triangle' }); tone(260, .18, { t: t + .13, v: .1, type: 'triangle' }); }],
  boxShake: ['Mystery Box wiggles on the conveyor: rattle', t => { for (let i = 0; i < 6; i++) noise(.05, { t: t + i * .075, f: 900 + (i % 2) * 500, q: 3, v: .14 }); }],
  boxPop: ['Box bursts open: "pop!" plus a whoosh', t => { tone(160, .18, { t, v: .25, slide: .5 }); noise(.35, { t, f: 600, f2: 6000, q: .7, v: .12 }); }],
  revealC: ['Reveal: Common (2 friendly notes)', t => { pluck(72, t, .13); pluck(79, t + .1, .13, .5); }],
  revealU: ['Reveal: Uncommon (3 notes)', t => arp([72, 76, 79], .09, (m, tt) => pluck(m, tt, .13, .5), t)],
  revealR: ['Reveal: Rare (bells arpeggio)', t => arp([72, 76, 79, 84], .08, (m, tt) => bell(m, tt, .1, 1), t)],

const SCALES = { maj: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 8, 10], pent: [0, 2, 4, 7, 9, 12, 14] };

    };
  }
  const starRow = (n, big) => `<span class="${big ? 'stars big' : 'stars'}">${[0, 1, 2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  function levelMenu(game, L, rw) {
    const top = L.top, from = Math.max(1, top - 13), btns = [];
    for (let n = from; n <= top + 2; n++) btns.push(n <= top ? `<button type="button" class="lv${n === top ? ' cur' : ''}${n % 10 === 0 ? ' boss' : ''}" data-go="${n}" aria-label="Level ${n}">${n}${starRow(L.stars(n))}</button>` : `<button type="button" class="lv lock" disabled aria-label="Level ${n} locked">${n}</button>`);
    return `<p class="eyebrow">Squishy Island minigame</p><h1>${game.title}</h1><p class="sub">${game.where}</p><details class="how"${top === 1 ? ' open' : ''}><summary>How to play</summary><ul>${game.how.map(h => `<li>${h}</li>`).join('')}</ul>${rw}</details><p class="best">Stars collected: <b>${L.total()}</b></p><button class="go" type="button" data-go="${top}">Play level ${top}</button><div class="lvgrid">${btns.join('')}</div><p class="keys">${game.keys || ''}</p>`;
  }
  function levelPay(L, r) {
    if (!r.win) return { total: 0, html: '<div class="pay"><p class="pay-sm">No coins this time. Beat the level to earn coins!</p></div>' };
    const f = L.finish(r.n, r.stars); Object.assign(r, f);
    const k = Math.max(0, r.stars - f.prev), why = f.first ? `first clear: 30 + 15 per star${f.big ? ' · big level ×2' : ''}` : k ? `replay: 10 + 15 for ${k} new star${k > 1 ? 's' : ''}` : 'replay: 10 coins (get more stars for more)';
    return { total: f.coins, html: `<div class="pay"><p class="pay-big"><i class="ci" aria-hidden="true"></i>+<span data-count="${f.coins}" data-kind="coins">${f.coins}</span> coins</p><p class="pay-sm">${why}</p></div>` };
  }
  function levelOver(r, pay) {
    return `<p class="eyebrow">Level ${r.n}${r.n % 10 === 0 ? ' · big level' : ''}</p><h1>${r.win ? 'Level clear!' : r.title || 'Out of moves'}</h1>${r.win ? starRow(r.stars, true) : ''}<p class="sub">${r.line || ''}</p>${r.win && r.stars > r.prev && !r.first ? '<p class="nb">New best stars!</p>' : ''}${pay}<div class="btnrow">${r.win ? `<button class="go" type="button" data-go="${r.n + 1}">Next level</button>` : `<button class="go" type="button" data-go="${r.n}">Try again</button>`}</div><div class="btnrow">${r.win ? `<button class="ghost" type="button" data-go="${r.n}">Replay</button>` : ''}<button class="ghost" type="button" data-act="menu">All levels</button></div>`;
  }
  // tiny seeded random, so level N is always the same level for everyone
  function rng(seed) { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  return { run, IMG, D, W, H, store, levels, levelMenu, levelPay, levelOver, starRow, rng };
})();

</script>
<script>
/* ===================== SKY BOUNCE (Bounce Park) =====================
   Endless jumper: bounce from cloud to cloud and climb as high as you can.
   It gets harder the higher you go: bigger gaps, moving leaves, crumbly clouds. */
(() => {
const { D, W, H } = SQV, INK = D.INK;
let S;
function lerpC(a, b, t) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
const SKY = [[0, '#DFF3FF', '#8CCBFF'], [2500, '#FFE3EE', '#FFB3CE'], [6000, '#FFD9A8', '#B9A6FF'], [11000, '#5B4BA8', '#2E2452']];
function skyAt(h) { for (let i = SKY.length - 1; i >= 0; i--) if (h >= SKY[i][0]) { const n = SKY[i + 1]; if (!n) return [SKY[i][1], SKY[i][2]]; const t = Math.min(1, (h - SKY[i][0]) / (n[0] - SKY[i][0])); return [lerpC(SKY[i][1], n[1], t), lerpC(SKY[i][2], n[2], t)]; } return [SKY[0][1], SKY[0][2]]; }

function addPlat(y) {
  const h = -y, diff = Math.min(1, h / 12000);
  const r = Math.random(), w = 70 - diff * 18;
  let type = 'cloud';
  if (h > 600 && r < .12 + diff * .2) type = 'crumble';
  else if (h > 300 && r < .32 + diff * .3) type = 'leaf';
  // never further sideways than a bounce can steer, measured straight across (most players don't go round the edge)
  let vx = type === 'leaf' && h > 1200 && !S.lastMoving ? (Math.random() < .5 ? -1 : 1) * (40 + diff * 90) : 0;   // never two drifting leaves in a row
  // a drifting leaf (this one or the one below) may be up to LEAF_RANGE further away when you jump
  const reach = Math.max(40, reachX(Math.abs(y - S.lastY)) - (vx || S.lastMoving ? LEAF_RANGE : 0)); let px = 30 + Math.random() * (W - 60), dx = px - S.lastX;
  if (Math.abs(dx) > reach) px = Math.max(30, Math.min(W - 30, S.lastX + Math.sign(dx) * reach * (.5 + Math.random() * .5)));
  S.lastX = px; S.lastY = y; S.lastMoving = !!vx;
  const p = { x: px, x0: px, y, w, type, vx, dead: 0, spring: false };
  if (type !== 'crumble' && Math.random() < .08) p.spring = true;
  S.plats.push(p);
  if (Math.random() < .55) S.items.push({ k: 'coin', x: p.x + (Math.random() - .5) * 40, y: y - 40 - Math.random() * 30 });
  else if (h > 800 && Math.random() < .035) S.items.push({ k: 'balloon', x: p.x, y: y - 60 });
}
function gapAt(h) { return 62 + Math.min(95, h / 110); }
// the next cloud up: bigger gaps higher up, but never more than a normal bounce (rises about 192) comfortably reaches
const MAX_GAP = 140, LEAF_RANGE = 70, nextGap = h => Math.min(MAX_GAP, gapAt(h) * (.7 + Math.random() * .5));
// how far sideways a bounce comfortably steers: the flight time less a moment to react, with a margin
const reachX = gap => 330 * Math.max(0, (760 + Math.sqrt(Math.max(0, 760 * 760 - 3000 * gap))) / 1500 - .2) * .8;

const game = {
  id: 'sky-bounce', title: 'Sky Bounce', where: 'at Bounce Park',
  how: ['Your squishy bounces by itself every time it lands.', 'Steer left and right to land on the next cloud.', 'Phone: hold or slide your finger left / right. PC: arrow keys or A / D.', 'Springs and balloons send you flying. Crumbly clouds break after one bounce.', 'It goes forever: the higher you climb, the trickier the sky.'],
  keys: 'PC: ← → or A / D · Enter to start', scoreName: 'metres high',
  coins: { rule: 'keep every coin you grab', from: 'coins grabbed', base: () => S.coins, tiers: [600, 1200, 2000], unit: 'm high' },
  overLine: () => `${S.coins} coins collected`,
  revive(G) { S.x = W / 2; S.y = S.camY + H - 140; S.vy = -900; S.float = 1.8; G.float(W / 2, H / 2, 'Up you go!', '#FFD54A', 26); },
  reviveGift: 'and float back up with a balloon',
  init(G) {
    S = { x: W / 2, y: -40, vy: -700, plats: [], items: [], camY: -H + 120, top: 0, coins: 0, steer: 0, target: null, keys: { l: false, r: false }, float: 0, squash: 0, face: 1, lastX: W / 2, lastY: 0, lastMoving: false };
    S.plats.push({ x: W / 2, y: 0, w: 120, type: 'cloud', vx: 0, dead: 0, spring: false });
    let y = 0; while (y > -H * 1.6) { y -= nextGap(-y); addPlat(y); }
  },
  update(dt, G) {
    // steering
    let ax = 0; if (S.keys.l) ax -= 1; if (S.keys.r) ax += 1;
    if (S.target != null) { const d = S.target - S.x; ax = Math.max(-1, Math.min(1, d / 40)); }
    S.x += ax * 330 * dt; if (ax) S.face = ax > 0 ? 1 : -1;
    if (S.x < -20) S.x += W + 40; if (S.x > W + 20) S.x -= W + 40;
    // physics
    if (S.float > 0) { S.float -= dt; S.vy = -520; } else S.vy += 1500 * dt;
    const prevY = S.y; S.y += S.vy * dt; S.squash = Math.max(0, S.squash - dt * 4);
    if (S.vy > 0) for (const p of S.plats) {
      if (p.dead) continue;
      if (prevY <= p.y - 2 && S.y >= p.y - 2 && Math.abs(S.x - p.x) < p.w / 2 + 14) {
        S.y = p.y - 2; S.squash = 1;
        if (p.spring && Math.abs(S.x - p.x) < 22) { S.vy = -1180; G.sfx(500, .25, 'sine', .1, 3); G.burst(S.x, p.y, '#FF6F7D', 8); }
        else { S.vy = -760; G.sfx(420 + Math.random() * 80, .09, 'sine', .08, 1.6); }
        if (p.type === 'crumble') { p.dead = .01; G.noise(.12, .07, 1200); }
        break;
      }
    }
    S.plats.forEach(p => { if (p.vx) { p.x += p.vx * dt; const lo = Math.max(p.w / 2, p.x0 - LEAF_RANGE), hi = Math.min(W - p.w / 2, p.x0 + LEAF_RANGE); if (p.x < lo) { p.x = lo; p.vx = Math.abs(p.vx); } else if (p.x > hi) { p.x = hi; p.vx = -Math.abs(p.vx); } } if (p.dead) p.dead += dt; });
    // items
    S.items.forEach(it => { if (it.got) return; if (Math.hypot(it.x - S.x, it.y - (S.y - 26)) < 30) { it.got = true; if (it.k === 'coin') { S.coins++; G.sfx(1400, .07, 'square', .05, 1.4); G.float(it.x, it.y - S.camY - 10, '+1', '#FFD54A', 15); } else { S.float = 2.4; G.sfx(700, .4, 'sine', .1, 2); } } });
    // camera + score
    S.top = Math.max(S.top, -S.y); const want = S.y - H * .42; if (want < S.camY) S.camY += (want - S.camY) * Math.min(1, dt * 8);
    G.score = Math.floor(S.top / 10);
    // spawn ahead / clean behind
    let highest = Math.min(...S.plats.map(p => p.y)); while (highest > S.camY - 200) { highest -= nextGap(-highest); addPlat(highest); }
    S.plats = S.plats.filter(p => p.y < S.camY + H + 60 && p.dead < 1); S.items = S.items.filter(i => !i.got && i.y < S.camY + H + 60);
    if (S.y > S.camY + H + 40) G.end();
  },
  draw(c, G) {
    const h = S.top, [a, b] = skyAt(h), gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, b); gr.addColorStop(1, a); c.fillStyle = gr; c.fillRect(0, 0, W, H);
    if (h > 8000) { c.fillStyle = '#FFF3B0'; for (let i = 0; i < 40; i++) { const sx = (i * 97) % W, sy = ((i * 173 - S.camY * .2) % H + H) % H; c.globalAlpha = Math.min(1, (h - 8000) / 3000) * (.4 + .6 * Math.abs(Math.sin(G.t * 2 + i))); c.fillRect(sx, sy, 2.5, 2.5); } c.globalAlpha = 1; }
    // far clouds (parallax)
    for (let i = 0; i < 6; i++) { const y = ((i * 140 - S.camY * .3) % (H + 120) + H + 120) % (H + 120) - 60, x = (i * 131) % W; c.globalAlpha = .5; cloud(c, x, y, 34, '#FFFFFF', null); c.globalAlpha = 1; }
    const oy = -S.camY;
    if (S.camY > -H) { c.fillStyle = '#9ED67E'; c.fillRect(0, oy + 10, W, 400); }
    S.plats.forEach(p => {
      const y = p.y + oy; if (y < -30 || y > H + 30) return;
      c.save(); if (p.dead) { c.globalAlpha = Math.max(0, 1 - p.dead * 2); c.translate(0, p.dead * 120); }
      if (p.type === 'leaf') { c.beginPath(); c.ellipse(p.x, y + 4, p.w / 2, 9, 0, 0, Math.PI * 2); c.fillStyle = '#7ED36A'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke(); c.lineWidth = 1.5; c.strokeStyle = '#4E9B4E'; c.beginPath(); c.moveTo(p.x - p.w / 2 + 8, y + 4); c.lineTo(p.x + p.w / 2 - 8, y + 4); c.stroke(); }
      else cloud(c, p.x, y + 6, p.w / 2, p.type === 'crumble' ? '#E3DEEF' : '#FFFFFF', p.type === 'crumble');
      if (p.spring) { c.lineWidth = 2.5; c.strokeStyle = '#9A8FAA'; c.beginPath(); c.moveTo(p.x - 6, y - 2); c.lineTo(p.x + 6, y - 6); c.lineTo(p.x - 6, y - 10); c.lineTo(p.x + 6, y - 14); c.stroke(); D.rr(c, p.x - 12, y - 20, 24, 7, 3.5, '#FF6F7D'); }
      c.restore();
    });
    S.items.forEach(it => { const y = it.y + oy + Math.sin(G.t * 3 + it.x) * 3; if (it.k === 'coin') D.coin(c, it.x, y, 8); else { c.lineWidth = 1.5; c.strokeStyle = '#9A8FAA'; c.beginPath(); c.moveTo(it.x, y + 16); c.quadraticCurveTo(it.x - 6, y + 28, it.x, y + 38); c.stroke(); c.beginPath(); c.ellipse(it.x, y, 13, 16, 0, 0, Math.PI * 2); c.fillStyle = '#FF6FA3'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke(); } });
    // player
    const px = S.x, py = S.y + oy, sq = S.squash;
    if (S.float > 0) { c.lineWidth = 1.5; c.strokeStyle = '#9A8FAA'; c.beginPath(); c.moveTo(px, py - 52); c.lineTo(px + 4, py - 80); c.stroke(); c.beginPath(); c.ellipse(px + 4, py - 96, 14, 18, 0, 0, Math.PI * 2); c.fillStyle = '#FF6FA3'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke(); }
    D.sprite(c, 'marshmallow', px, py, 64, { sx: 1 + sq * .22 - (S.vy < -300 ? .08 : 0), sy: 1 - sq * .22 + (S.vy < -300 ? .1 : 0), flip: S.face < 0 });
    if (S.target != null) { c.globalAlpha = .35; D.circle(c, S.target, H - 30, 14, '#FFFFFF', INK, 2); c.globalAlpha = 1; }
    // hud
    D.rr(c, 10, 12, 132, 30, 15, '#FFFFFF'); D.text(c, `${G.score.toLocaleString('en-US')} m`, 76, 28, 16, INK, 'center', 'body');
    D.rr(c, W - 92, 12, 82, 30, 15, '#FFFFFF'); D.coin(c, W - 74, 27, 8); D.text(c, String(S.coins), W - 46, 28, 15, INK, 'center', 'body');
    if (G.best && S.top / 10 < G.best) { const by = -G.best * 10 + oy; if (by > 50 && by < H) { c.setLineDash([8, 6]); c.strokeStyle = '#FF6FA3'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, by); c.lineTo(W, by); c.stroke(); c.setLineDash([]); D.text(c, 'your best', W - 50, by - 10, 11, '#FF6FA3', 'center', 'body'); } }
  },
  down(x) { S.target = x; }, move(x, y, id, pressed) { if (pressed && S.target != null) S.target = x; }, up() { S.target = null; },
  key(code, down) { if (code === 'ArrowLeft' || code === 'KeyA') S.keys.l = down; else if (code === 'ArrowRight' || code === 'KeyD') S.keys.r = down; else return false; }
};
function cloud(c, x, y, r, col, cracked) {
  const pts = [[-.6, .1, .55], [-.2, -.25, .7], [.3, -.2, .65], [.68, .1, .5], [0, .2, .6]];
  c.beginPath(); pts.forEach(([a, b, s]) => { c.moveTo(x + a * r + s * r * .6, y + b * r * .6); c.arc(x + a * r, y + b * r * .6, s * r * .6, 0, Math.PI * 2); });
  if (col) { c.fillStyle = col; c.fill(); }
  if (cracked !== null) { c.lineWidth = 2.4; c.strokeStyle = INK; c.stroke(); c.fillStyle = col; pts.forEach(([a, b, s]) => { c.beginPath(); c.arc(x + a * r, y + b * r * .6, s * r * .6 - 1.4, 0, Math.PI * 2); c.fill(); }); }
  if (cracked) { c.lineWidth = 2; c.strokeStyle = '#9A8FAA'; c.beginPath(); c.moveTo(x - 6, y - 8); c.lineTo(x, y); c.lineTo(x - 4, y + 6); c.moveTo(x + 10, y - 6); c.lineTo(x + 6, y + 2); c.stroke(); }
}
SQV.G = SQV.run(game); SQV.state = () => S;
})();
